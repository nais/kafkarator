# Deploy cronjob: mints a short-lived service account token and applies the
# canary manifest to each environment.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "kafka-canary.fullname" . }}
  labels:
    {{- include "kafka-canary.labels" . | nindent 4 }}
spec:
  schedule: "*/30 * * * *"
  startingDeadlineSeconds: 600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  suspend: false
  jobTemplate:
    spec:
      template:
        {{- include "kafka-canary.job-template" (set . "command" "deploy") | nindent 8 }}
