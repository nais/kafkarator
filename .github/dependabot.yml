version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      k8s:
        patterns:
          - k8s.io/api*
          - k8s.io/client-go
          - sigs.k8s.io/controller-runtime
      gomod:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      gha:
        patterns:
          - '*'
    open-pull-requests-limit: 5
